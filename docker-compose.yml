services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: capital_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: src/CapitalTracker.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=capital_tracker;Username=postgres;Password=postgres"
      Jwt__Secret: "${JWT_SECRET:?Set JWT_SECRET in your .env file}"
      InitialUser__Email: "${INITIAL_USER_EMAIL:?Set INITIAL_USER_EMAIL in your .env file}"
      InitialUser__Password: "${INITIAL_USER_PASSWORD:?Set INITIAL_USER_PASSWORD in your .env file}"
    ports:
      - "5000:8080"

  worker:
    build:
      context: ./backend
      dockerfile: src/CapitalTracker.Worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=capital_tracker;Username=postgres;Password=postgres"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
